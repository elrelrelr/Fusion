name: Compilar APK de Fusion

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      variant:
        description: Variante a compilar
        default: assembleAfatDebug
        type: choice
        options: [ assembleAfatDebug, assembleAfatRelease ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Liberar espacio en el runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar NDK y CMake que pide Telegram
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Ajustar memoria de Gradle
        run: |
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: ./gradlew :TMessagesProj_AppStandalone:${{ inputs.variant || 'assembleAfatDebug' }} --no-daemon --stacktrace

      - name: Localizar el APK
        id: find
        run: echo "apk=$(find . -name '*.apk' -path '*outputs*' | head -1)" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Fusion-APK
          path: ${{ steps.find.outputs.apk }}
          if-no-files-found: error
