name: Telegram oficial + muro Fusion (reempaquetado)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # cada lunes: recoge la última versión de Telegram

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - name: Inyectar y firmar
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          chmod +x inyeccion/build-telegram-fusion.sh
          ./inyeccion/build-telegram-fusion.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Telegram-Fusion-APK
          path: Telegram-Fusion-*.apk
